<!DOCTYPE html>
<html>
<head>
    <title>Shop | Seven Sisters Savonnier</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="secondary-nav">
    <img src="images/logo.jpg" alt="Seven Sisters Savonnier logo" class="logo">

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="index.html#seven-sisters-difference">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
</nav>
<section class="collections">
    <h2>Shop Our Collections</h2>

    <div class="collection-carousel">

        <button class="collection-arrow collection-prev" type="button" aria-label="Previous collection">
            &#10094;
        </button>

        <div class="collection-card-wrapper">

           <a href="#" class="collection-card">
             <h3>All Collections</h3>
                <img src="images/all-collections-img.png" alt="All Collections">
             </a>
            <a href="#" class="collection-card">
                <h3>Garden Collection</h3>
                <img src="images/garden-collection-img.png" alt="Garden Collection">
            </a>
             <a href="#" class="collection-card">
                 <h3>Spa Collection</h3>
                <img src="images/spa-collection-img.png" alt="Spa Collection">
            </a>

            <a href="#" class="collection-card">
                 <h3>Lavender Collection</h3>
                 <img src="images/lavender-collection-img.png" alt="Lavender Collection">
            </a>

            <a href="#" class="collection-card">
                <h3>Sensitive Skin Collection</h3>
                <img src="images/sensitive-skin-collection-img.png" alt="Sensitive Skin Collection">
            </a>

            <a href="#" class="collection-card">
                <h3>Signature Collection</h3>
                <img src="images/signature-collection-img.png" alt="Signature Collection">
            </a>

            <a href="#" class="collection-card">
                <h3>Earth and Sea Collection</h3>
                <img src="images/earth-and-sea-collection-img.png" alt="Earth and Sea Collection">
            </a>   
        </div>

        <button class="collection-arrow collection-next" type="button" aria-label="Next collection">
            &#10095;
        </button>

    </div>
</section>
<script>
    const cards = document.querySelectorAll('.collection-card');
    const previousButton = document.querySelector('.collection-prev');
    const nextButton = document.querySelector('.collection-next');

    let currentCollection = 0;

    function showCollection(index) {
        cards.forEach((card, i) => {
            card.style.display = i === index ? 'block' : 'none';
        });
    }

    previousButton.addEventListener('click', () => {
        currentCollection--;

        if (currentCollection < 0) {
            currentCollection = cards.length - 1;
        }

        showCollection(currentCollection);
    });

    nextButton.addEventListener('click', () => {
        currentCollection++;

        if (currentCollection >= cards.length) {
            currentCollection = 0;
        }

        showCollection(currentCollection);
    });

    showCollection(currentCollection);
</script>
</body>
</html>
